name: R smoke test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libcairo2-dev libxt-dev libfontconfig1-dev
      - name: Install R dependencies
        run: Rscript scripts/00_install.R
      - name: Check environment
        run: Rscript scripts/00_check_environment.R
      - name: Run smoke test
        run: Rscript tests/smoke_test.R
      - name: Run quick pipeline
        run: CORES=2 BACKEND=multisession Rscript scripts/00_run_all_quick.R
